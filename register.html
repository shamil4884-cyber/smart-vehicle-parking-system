<!DOCTYPE html>
<html>
<head>
    <title>Register - Smart Car Parking System</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        /* Import Outfit font */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 50%, #121622 0%, #080a0e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .register-box {
            background: rgba(18, 22, 31, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 30px 40px;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .register-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        table {
            width: 100%;
        }

        td {
            padding-bottom: 10px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #5c64ec;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 12px rgba(92, 100, 236, 0.3);
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #5c64ec;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
            margin-top: 10px;
            font-family: 'Outfit', sans-serif;
        }

        input[type="submit"]:hover {
            background: #4b52cc;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(92, 100, 236, 0.3);
        }

        /*back button*/
        .back-btn {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            border: 2px solid #5c64ec;
            background: transparent;
            color: #5c64ec;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
        }

        .back-btn:hover {
            background: #5c64ec;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(92, 100, 236, 0.2);
        }

        /*mobile responsiveness*/
        @media (max-width: 480px) {
            .register-box {
                padding: 25px 20px;
            }
            input[type="submit"],
            .back-btn {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
<link rel="stylesheet" href="/static/css/scps-refresh.css">
</head>
<body>
    <div class="register-box">
        <h2>Register</h2>
        {% if messages %}
            {% for msg in messages %}
                <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; padding: 10px; border-radius: 8px; font-size: 14px; text-align: center; margin-bottom: 20px;">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}
        <form method="post" action="/register/">
            {% csrf_token %}
            <table>
                <tr>
                    <td>Full Name</td>
                </tr>
                <tr>
                    <td>
                        <input type="text" name="full_name" placeholder="Enter full name" required>
                    </td>
                </tr>
                <tr>
                    <td>Email Address</td>
                </tr>
                <tr>
                    <td>
                        <input type="email" name="email" placeholder="Enter email" required>
                    </td>
                </tr>
                <tr>
                    <td>Mobile Number</td>
                </tr>
                <tr>
                    <td>
                        <input type="text" name="mobile_number" placeholder="Enter mobile number" required>
                    </td>
                </tr>
                <tr>
                    <td>Register As</td>
                </tr>
                <tr>
                    <td>
                        <select name="role" style="width: 100%; padding: 10px 14px; background: rgba(255, 255, 255, 0.04); border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08); color: #ffffff; font-size: 14px; outline: none; transition: all 0.3s; box-sizing: border-box; font-family: 'Outfit', sans-serif;">
                            <option value="user" style="background: #121622; color: #fff;">Driver / Customer</option>
                            <option value="mall" style="background: #121622; color: #fff;">Mall Representative / Owner</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Username</td>
                </tr>
                <tr>
                    <td>
                        <input type="text" name="user_name" placeholder="Choose a username" required autocomplete="off">
                    </td>
                </tr>
                <tr>
                    <td>Password</td>
                </tr>
                <tr>
                    <td>
                        <input type="password" name="password" placeholder="Create a password" required>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="submit" value="Register">
                    </td>
                </tr>
                <tr>
                    <td>
                        <a href="/" class="back-btn" style="text-decoration: none; display: block; text-align: center; box-sizing: border-box;">⬅ Home</a>
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
